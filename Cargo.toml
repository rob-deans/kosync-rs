[package]
name = "kosync-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8", features = ["macros"] }
jiff = { version = "0.2.35", features = ["serde"] }
serde = "1.0.229"
serde_json = "1.0.151"
toasty = { version = "0.10.0", features = ["jiff", "migration", "serde", "sqlite"] }
toasty-cli = "0.10.0"
tokio = { version = "1.53.1", features = ["full", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
